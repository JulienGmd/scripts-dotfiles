name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: bash test.sh

  coverage:
    # 22.04 still ships kcov in apt (dropped in 24.04 / ubuntu-latest)
    runs-on: ubuntu-22.04
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Install kcov
        run: sudo apt-get update && sudo apt-get install -y kcov

      - name: Measure coverage
        run: |
          kcov --include-pattern=dotfiles.sh "$PWD/coverage" bash test.sh
          report="$(find coverage -name coverage.json | head -1)"
          pct="$(jq -r '.percent_covered' "$report")"
          echo "Line coverage (dotfiles.sh): ${pct}%"
          echo "### Coverage (dotfiles.sh): ${pct}%" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage
